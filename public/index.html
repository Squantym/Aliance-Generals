<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="description" content="Альянс Генералов — браузерная военная стратегия. Командуй армией, побеждай противников, становись лучшим генералом!">
  <meta name="robots" content="index, follow">
  <title>Альянс Генералов — браузерная военная игра</title>
  <!-- БАГ 14: favicon -->
  <link rel="icon" type="image/png" href="/favicon.png">

  <!-- PWA: установка на телефон (иконка на рабочем столе, полноэкранный режим) -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0d08">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- iOS: свой набор мета-тегов, стандартные он не понимает -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Альянс Генералов">
  <link rel="apple-touch-icon" href="/img/pwa/apple-touch-icon-180.png">

  <!-- Стили и ядро скриптов просим заранее и с высоким приоритетом:
       браузер начинает качать их сразу, не дожидаясь разбора страницы.
       На медленной связи это заметно сокращает время до первого экрана. -->
  <link rel="preload" href="/css/style.css" as="style">
  <link rel="preload" href="/js/app.js" as="script">
  <link rel="preload" href="/js/screens/core.js" as="script">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* БАГ 8: запрет горизонтального скролла на мобильных */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { overflow-x: hidden; max-width: 100%; }
  </style>
</head>
<body>
  <!-- Колонка игры: шапка с ресурсами + сменное содержимое экрана -->
  <div id="wrap">
    <header id="header"></header>
    <main id="content"></main>
  </div>

  <!-- Правовые документы: обязательны для платежей и магазинов приложений,
       поэтому открываются отдельными страницами без входа в игру -->
  <footer id="site-footer">
    <!-- Переключение персонажа. Появляется только после входа —
         до этого показывать нечего. -->
    <button id="cabinet-btn" class="cabinet-btn" style="display:none"
            onclick="App.go('cabinet')">🎖 Мои персонажи</button>
    <div id="online-counter" class="online-counter">
      <span class="online-dot"></span><span id="online-num">—</span> в игре
    </div>
    <a href="/terms.html">Пользовательское соглашение</a>
    <span class="footer-sep">·</span>
    <a href="/privacy.html">Политика конфиденциальности</a>
  </footer>

  <!-- Контейнер всплывающих уведомлений (награды, ошибки, события) -->
  <div id="toasts"></div>

  <!-- Порядок подключения важен: сначала ядро, потом экраны -->
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/app.js"></script>
  <!-- Ядро экранов: главная, профиль, настройки, кабинет — нужно сразу.
       Остальные разделы (война, рынок, общение, новости, производство,
       диверсанты) подгружаются при первом переходе: см. App._loadScreen.
       Это снимает с первого захода около трети веса. -->
  <script src="/js/screens/core.js"></script>
  <script>App.init();</script>
</body>
</html>
